{% extends "tache/base.html" %}

{% block content %}
<script>
    var decs = document.getElementById('dec')
    decs.style.display = "none"
</script>
    <h2 class="text-2xl font-bold space-y-4 p-2">Connexion</h2>
    <form method="post">
        {% csrf_token %}
        <div class="space-y-4 ts-dm text-gray-900 font-semibold p-2">
            {{ form.as_p }}
        </div>
        <button type="submit" class="w-full px-4 py-2 rounded-lg bg-blue-600 text-white font-medium hover:bg-green-600">Se connecter</button>
    </form>
    {% if error %}
        <p style="color: red;">{{ error }}</p>
    {% endif %}
{% endblock %}
