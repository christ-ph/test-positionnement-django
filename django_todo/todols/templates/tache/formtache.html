{% extends 'tache/base.html' %}

{% block content %}

<form method="post" class="space-y-4">
    {% csrf_token %}
    {{ form.titre }}
    {{ form.description }}
    {{ form.status }}
    {{ form.priorite }}
    {{ form.date_echeance }}
    <button class="w-full px-4 py-2 rounded-lg bg-blue-600 text-white font-medium hover:bg-blue-700" type="submit">Enregistrer</button>
</form>

{% endblock %}
