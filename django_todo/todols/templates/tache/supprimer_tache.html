{% extends 'tache/base.html' %}

{% block content %}
<div class="space-y-4 text-center">
    <h1 class="font-bold text-lg text-gray-900">Supprimer la tâche</h1>
    <p class="text-sm text-gray-600">Es-tu sûr de vouloir supprimer « {{ tache.titre }} » ? Cette action est irréversible.</p>
    <form method="post" class="flex gap-2 justify-center">
        {% csrf_token %}
        <a href="{% url 'liste_taches' %}" class="px-4 py-2 rounded-lg bg-gray-100 text-gray-700 hover:bg-gray-200">Annuler</a>
        <button type="submit" class="px-4 py-2 rounded-lg bg-red-600 text-white hover:bg-red-700">Confirmer la suppression</button>
    </form>
</div>
{% endblock %}
